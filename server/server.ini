[Library]

; на Pi: /mnt/music
root = ./music

covers_dir = ./covers

[Index]

batch_size = 200

; 0 = только вручную
auto_rescan_minutes = 60

[Server]

host = 0.0.0.0

port = 8000

; Старый одиночный токен. Работает (в логе — под именем owner), но лучше перенести в [Tokens]
;token =

; Кто может удалять файлы с сервера (экран «Отладочный режим» плеера): имена из [Tokens]
; через запятую. Загружать и откатывать свою загрузку может любой с токеном.
; Нет ни одного токена — администраторов нет, удаление выключено.
;admins = me

[Tokens]
; Токен на каждого человека: «имя = токен». Нет ни одной строки — сервер открыт для всех в сети.
; Свой токен человек вписывает в config.txt плеера, [Server] token.
; Отозвать доступ — удалить строку и перезапустить сервер: systemctl restart musicserver
; Имя пишется в лог сервера: «sasha слушает трек 42». Сгенерировать токен:
;   python3 -c "import secrets; print(secrets.token_urlsafe(32))"
;me = 
;sasha = 