[Library]

; на Pi: /mnt/music
root = ./music

covers_dir = ./covers

[Index]

batch_size = 200

; 0 = только вручную
auto_rescan_minutes = 60

[Server]

host = 0.0.0.0

port = 8000

; Токен доступа. Пусто или закомментировано — сервер открыт для всех в сети.
; Тот же токен — в config.txt плеера, [Server] token. Сгенерировать:
;   python3 -c "import secrets; print(secrets.token_urlsafe(32))"
;token =